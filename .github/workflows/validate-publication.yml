name: Validate publication

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate dataset and result JSON
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < dataset/agent-framework/v1/tasks.jsonl | tr -d ' ')" = "20"
          jq -e '.task_count == 20 and .gold_visibility == "public"' dataset/agent-framework/v1/manifest.json >/dev/null
          while IFS= read -r file; do jq -e . "$file" >/dev/null; done < <(find dataset results -type f -name '*.json' -print)
          while IFS= read -r file; do jq -e . "$file" >/dev/null; done < <(find dataset results -type f -name '*.jsonl' -print)

      - name: Enforce public artifact hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIl '/Users/' dataset results site >/dev/null; then exit 1; fi
          if grep -RIl 'repoqa' dataset results site >/dev/null; then exit 1; fi
          test -z "$(find . -type f -size +50M -not -path './.git/*' -print -quit)"

